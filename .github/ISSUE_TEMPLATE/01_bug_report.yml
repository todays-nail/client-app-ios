name: Bug Report
description: 버그 제보 및 장애 리포트
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 정보 위주로 작성해주세요.
        민감정보(토큰, 개인정보, 내부 키)는 제거 후 첨부하세요.

  - type: checkboxes
    id: precheck
    attributes:
      label: 사전 확인
      options:
        - label: 기존 이슈를 검색했고 중복이 아님을 확인했습니다.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 어떤 문제가 발생했는지 한두 문장으로 작성해주세요.
      placeholder: 예) 예약 상세 화면 진입 시 앱이 즉시 종료됩니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 재현 순서를 단계별로 작성해주세요.
      placeholder: |
        1. 앱 실행
        2. 마이페이지 탭 이동
        3. 예약 내역 선택
        4. 크래시 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      placeholder: 예) 예약 상세 화면이 정상적으로 렌더링된다.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      placeholder: 예) 로딩 직후 앱이 종료된다.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경 정보
      description: 가능한 한 구체적으로 적어주세요.
      value: |
        - App version:
        - iOS version:
        - Device:
        - Network:
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 영향도
      options:
        - P0 (서비스 핵심 기능 완전 불가)
        - P1 (주요 기능 심각 장애)
        - P2 (우회 가능, 중간 영향)
        - P3 (경미한 문제)
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 증거 자료
      description: 로그, 스택트레이스, 스크린샷 링크를 첨부해주세요.
      render: shell

  - type: textarea
    id: references
    attributes:
      label: 관련 링크
      description: 관련 Notion/PR/Issue/문서 링크를 남겨주세요.
      placeholder: |
        - Notion:
        - Related Issue:
        - Related PR:
