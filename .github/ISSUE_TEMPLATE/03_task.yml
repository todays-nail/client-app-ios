name: Task
description: 리팩토링/문서/테스트/운영 작업
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        기능 추가가 아닌 실행 작업(정리/개선/운영)을 위한 템플릿입니다.

  - type: textarea
    id: objective
    attributes:
      label: 작업 목적
      placeholder: 예) 로그인 모듈 에러 처리 경로를 단순화해 유지보수성을 높인다.
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      options:
        - client-app-ios
        - infra
        - docs
        - ci
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 작업 체크리스트
      placeholder: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건 (Definition of Done)
      placeholder: |
        - [ ] 코드/문서 반영 완료
        - [ ] 필요한 빌드/테스트 실행 완료
        - [ ] PR에서 해당 이슈를 Closes로 연결
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 링크
      placeholder: |
        - Related Issue:
        - Related PR:
        - Docs/Notion:
