name: Feature Request
description: 기능 제안 및 개선 요청
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        해결하려는 문제와 기대 효과를 중심으로 작성해주세요.

  - type: checkboxes
    id: precheck
    attributes:
      label: 사전 확인
      options:
        - label: 기존 이슈를 검색했고 중복이 아님을 확인했습니다.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 배경/문제
      description: 현재 어떤 불편 또는 한계가 있는지 작성해주세요.
      placeholder: 예) 네일샵 필터 기준이 부족해 원하는 샵을 찾기 어렵다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작/해결안을 구체적으로 작성해주세요.
      placeholder: 예) 지역/가격/리뷰/당일예약 가능 여부 필터를 추가한다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준 (Acceptance Criteria)
      description: 완료 여부를 판단할 수 있는 기준을 작성해주세요.
      placeholder: |
        - [ ] 필터 UI에서 지역/가격/리뷰/당일예약 옵션 선택 가능
        - [ ] 필터 적용 시 목록 결과가 즉시 갱신됨
        - [ ] 필터 초기화 버튼 동작
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위 (In scope / Out of scope)
      placeholder: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 링크
      description: 관련 Notion/디자인/문서/회의록 링크를 남겨주세요.
      placeholder: |
        - Notion Spec:
        - Figma:
        - Related Docs:

  - type: checkboxes
    id: notion-alignment
    attributes:
      label: Notion 정합성 확인
      description: DB/API/요구사항 변경이 있는 경우 필수
      options:
        - label: Notion 기준 문서와 대조했고, 변경 포인트를 본문 링크에 남겼습니다.
          required: false
