name: Refactor
description: 구조 개선, 리팩터링, 운영성 향상 이슈
title: "[refactor]: "
body:
  - type: markdown
    attributes:
      value: |
        구조 개선이나 리팩터링 작업을 위한 템플릿입니다.

  - type: textarea
    id: problem
    attributes:
      label: Background / Problem
      placeholder: 예) UI 계층 경계가 흐려 변경 영향 추적과 프리뷰 안정성이 떨어진다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Expected Result / Acceptance Criteria
      placeholder: |
        - [ ] 구조 개선 목표가 반영됨
        - [ ] 회귀 없이 유지보수성이 개선됨
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      placeholder: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Related Links
      placeholder: |
        - Related Issue:
        - Related PR:
        - Docs:
    validations:
      required: true
