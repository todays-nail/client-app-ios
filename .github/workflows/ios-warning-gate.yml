name: ios-warning-gate

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  warning-gate:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant iOS changes
        id: detect
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1

          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(NailClient/|scripts/ios-warning-gate\.sh|\.github/workflows/ios-warning-gate\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Xcode path
        if: steps.detect.outputs.changed == 'true'
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      - name: Xcode Version
        if: steps.detect.outputs.changed == 'true'
        run: $DEVELOPER_DIR/usr/bin/xcodebuild -version

      - name: Run iOS Warning Gate
        if: steps.detect.outputs.changed == 'true'
        run: |
          chmod +x scripts/ios-warning-gate.sh
          bash scripts/ios-warning-gate.sh

      - name: Skip warning gate when iOS files are unchanged
        if: steps.detect.outputs.changed != 'true'
        run: echo "No iOS source changes detected. Skipping warning gate."
