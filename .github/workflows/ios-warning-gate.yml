name: ios-warning-gate

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  warning-gate:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant iOS changes
        id: detect
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1

          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(\.xcode-version|NailClient/|Packages/|scripts/ios-warning-gate\.sh|scripts/resolve-xcode-developer-dir\.sh|\.github/workflows/ios-warning-gate\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve DEVELOPER_DIR
        if: steps.detect.outputs.changed == 'true'
        run: |
          chmod +x scripts/resolve-xcode-developer-dir.sh scripts/ios-warning-gate.sh
          echo "DEVELOPER_DIR=$(./scripts/resolve-xcode-developer-dir.sh)" >> "$GITHUB_ENV"

      - name: Validate Xcode path
        if: steps.detect.outputs.changed == 'true'
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      - name: Xcode Version
        if: steps.detect.outputs.changed == 'true'
        run: |
          PINNED_XCODE_VERSION="$(tr -d '[:space:]' < .xcode-version)"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version | grep -q "^Xcode ${PINNED_XCODE_VERSION}"

      - name: Run iOS Warning Gate
        if: steps.detect.outputs.changed == 'true'
        run: bash scripts/ios-warning-gate.sh

      - name: Skip warning gate when iOS app and package files are unchanged
        if: steps.detect.outputs.changed != 'true'
        run: echo "No iOS app or local package changes detected. Skipping warning gate."
