name: ios-warning-gate

on:
  pull_request:
    paths:
      - "NailClient/**"
      - "scripts/ios-warning-gate.sh"
      - ".github/workflows/ios-warning-gate.yml"

jobs:
  warning-gate:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Xcode path
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      - name: Xcode Version
        run: $DEVELOPER_DIR/usr/bin/xcodebuild -version

      - name: Run iOS Warning Gate
        run: |
          chmod +x scripts/ios-warning-gate.sh
          bash scripts/ios-warning-gate.sh
