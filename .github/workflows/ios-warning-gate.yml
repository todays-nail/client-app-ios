name: ios-warning-gate

on:
  pull_request:
    paths:
      - "NailClient/**"
      - "scripts/ios-warning-gate.sh"
      - ".github/workflows/ios-warning-gate.yml"

jobs:
  warning-gate:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode Version
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: $DEVELOPER_DIR/usr/bin/xcodebuild -version

      - name: Run iOS Warning Gate
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          chmod +x scripts/ios-warning-gate.sh
          bash scripts/ios-warning-gate.sh
