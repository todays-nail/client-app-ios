name: DB/Functions Governance Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block DB/Functions source changes in client-app-ios
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            DIFF_RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              DIFF_RANGE="HEAD~1...HEAD"
            else
              DIFF_RANGE="${BEFORE}...HEAD"
            fi
          fi

          echo "[guard] diff range: ${DIFF_RANGE}"
          CHANGED="$(git diff --name-status ${DIFF_RANGE} || true)"
          echo "${CHANGED}"

          violations=()
          while IFS=$'\t' read -r change_status path path2; do
            [[ -z "${path:-}" ]] && continue

            # Bootstrap transition allows deletions; block add/modify/rename/copy only.
            if [[ "${change_status}" == "D" ]]; then
              continue
            fi

            for candidate in "${path}" "${path2:-}"; do
              [[ -z "${candidate}" ]] && continue
              case "${candidate}" in
                infra/supabase/migrations/*|infra/supabase/functions/*|infra/supabase/dashboard-singlefile/*|infra/supabase/config.toml)
                  violations+=("${change_status} ${candidate}")
                  ;;
                infra/scripts/db-*.sh|infra/scripts/migrations-lint.sh|infra/scripts/shared-schema-branch-check.sh|infra/scripts/functions-check-*.sh|infra/scripts/edge-functions-check.sh)
                  violations+=("${change_status} ${candidate}")
                  ;;
              esac
            done
          done <<< "${CHANGED}"

          if [[ ${#violations[@]} -gt 0 ]]; then
            echo "ERROR: DB/Functions canonical source is shared-schema repository."
            echo "Blocked file changes:"
            printf ' - %s\n' "${violations[@]}"
            exit 1
          fi

          echo "[guard] passed"
