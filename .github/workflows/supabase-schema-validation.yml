name: Supabase Schema Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    env:
      SHARED_SCHEMA_REPO_URL: https://github.com/todays-nail/shared-schema.git
      SHARED_SCHEMA_REF: 1c1a08472bd9f0ef0f77e730ec7557bd0ac4a829
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration filenames
        run: bash infra/scripts/migrations-lint.sh

      - name: Validate shared-schema sync
        run: bash infra/scripts/db-sync-from-shared.sh --check
